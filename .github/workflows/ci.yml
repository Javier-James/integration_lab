name: ASML Scanner CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bazel / Build
        run: |
          bazel build //:scanner_app

      - name: Run Automated Log Triage Check
        run: |
          python3 parse_log.py --file scanner_system.log
